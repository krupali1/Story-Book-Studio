# Render blueprint. Persistent disks need a paid instance type.
services:
  - type: web
    name: storybook-studio
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: studio-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /data
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI  # https://<your-service>.onrender.com/auth/google/callback
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
